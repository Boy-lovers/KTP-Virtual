<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NachynTube - Premium Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.12);
            --tube-accent: #ff3b3b;
            --tube-glow: rgba(255,59,59,0.45);
            --tube-accent2: #ff8c42;
            --music-accent: #1db954;
            --music-glow: rgba(29,185,84,0.45);
            --music-accent2: #00c9ff;
            --text: #f0f0f0;
            --text-muted: rgba(255,255,255,0.45);
            --accent: #ff3b3b;
            --accent2: #ff8c42;
        }
        body.music-mode {
            --accent: #1db954;
            --accent2: #00c9ff;
            --tube-glow: rgba(29,185,84,0.45);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit',sans-serif; background:#080810; color:var(--text); overflow-x:hidden; min-height:100vh; transition: --accent 0.5s; }

        /* ── ANIMATED BG ORBS ── */
        .bg-orbs { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
        .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.16; animation:orbFloat linear infinite; transition: background 0.8s ease; }
        .orb-1 { width:500px;height:500px; background:radial-gradient(circle,#ff3b3b,transparent); top:-150px;left:-100px; animation-duration:20s; }
        .orb-2 { width:400px;height:400px; background:radial-gradient(circle,#7b2fff,transparent); top:40%;right:-120px; animation-duration:25s;animation-delay:-8s; }
        .orb-3 { width:350px;height:350px; background:radial-gradient(circle,#ff8c42,transparent); bottom:-100px;left:30%; animation-duration:18s;animation-delay:-5s; }
        .orb-4 { width:300px;height:300px; background:radial-gradient(circle,#00c9ff,transparent); top:20%;left:50%; animation-duration:22s;animation-delay:-12s; }

        body.music-mode .orb-1 { background:radial-gradient(circle,#1db954,transparent); }
        body.music-mode .orb-3 { background:radial-gradient(circle,#00c9ff,transparent); }

        @keyframes orbFloat {
            0%   { transform:translate(0,0) scale(1); }
            33%  { transform:translate(40px,-30px) scale(1.08); }
            66%  { transform:translate(-30px,50px) scale(0.95); }
            100% { transform:translate(0,0) scale(1); }
        }
        body::before {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image: linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px);
            background-size:40px 40px;
        }

        /* ── LOADER ── */
        #loader-bar {
            position:fixed; top:0; left:0; width:0%; height:2px; z-index:9999;
            background:linear-gradient(90deg,var(--accent),var(--accent2));
            transition:width 0.4s ease, background 0.5s ease;
            box-shadow:0 0 12px var(--tube-glow),0 0 24px var(--tube-glow);
        }

        /* ── NAVBAR ── */
        nav {
            position:sticky; top:0; z-index:200;
            display:flex; justify-content:space-between; align-items:center;
            padding:0 28px; height:58px;
            background:rgba(8,8,16,0.75);
            backdrop-filter:blur(24px) saturate(180%);
            border-bottom:1px solid var(--glass-border);
            box-shadow:0 4px 32px rgba(0,0,0,0.5);
        }

        /* Logo */
        .logo { font-size:21px; font-weight:800; letter-spacing:-0.5px; display:flex; align-items:center; gap:2px; }
        .logo-name { color:#fff; transition:opacity 0.3s; }
        .logo-badge {
            padding:2px 8px; border-radius:6px; color:white; position:relative; overflow:hidden;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            transition:background 0.5s ease;
        }
        .logo-badge::after {
            content:''; position:absolute; inset:0;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
            transform:translateX(-100%); animation:logoShine 3.5s ease-in-out infinite;
        }
        @keyframes logoShine { 0%,70%{transform:translateX(-100%)} 80%,100%{transform:translateX(100%)} }

        /* ── NAV TABS ── */
        .nav-tabs { display:flex; gap:4px; }
        .nav-tab {
            display:flex; align-items:center; gap:7px;
            padding:7px 16px; border-radius:20px; cursor:pointer;
            font-size:13.5px; font-weight:600; letter-spacing:0.02em;
            border:1px solid transparent;
            transition:all 0.3s cubic-bezier(.2,.8,.2,1);
            color:var(--text-muted); background:transparent;
            white-space:nowrap;
        }
        .nav-tab .tab-icon { font-size:15px; transition:transform 0.3s ease; }
        .nav-tab:hover { color:var(--text); background:rgba(255,255,255,0.07); border-color:var(--glass-border); }
        .nav-tab:hover .tab-icon { transform:scale(1.2); }

        .nav-tab.tube-tab.active {
            color:#fff;
            background:linear-gradient(135deg,rgba(255,59,59,0.2),rgba(255,140,66,0.15));
            border-color:rgba(255,59,59,0.4);
            box-shadow:0 0 16px rgba(255,59,59,0.2);
        }
        .nav-tab.music-tab.active {
            color:#fff;
            background:linear-gradient(135deg,rgba(29,185,84,0.2),rgba(0,201,255,0.15));
            border-color:rgba(29,185,84,0.4);
            box-shadow:0 0 16px rgba(29,185,84,0.2);
        }

        /* Search */
        .search-container { display:flex; width:36%; }
        .search-container input {
            flex:1; padding:9px 16px;
            background:rgba(255,255,255,0.06); border:1px solid var(--glass-border); border-right:none;
            color:white; font-family:'Outfit',sans-serif; font-size:13.5px;
            border-radius:22px 0 0 22px; outline:none; backdrop-filter:blur(10px);
            transition:all 0.3s ease;
        }
        .search-container input::placeholder { color:var(--text-muted); }
        .search-container input:focus { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25); }
        .search-container button {
            padding:9px 20px;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            border:none; color:white; font-family:'Outfit',sans-serif;
            font-size:13px; font-weight:600;
            border-radius:0 22px 22px 0; cursor:pointer;
            transition:all 0.3s ease; position:relative; overflow:hidden;
        }
        .search-container button:hover { filter:brightness(1.15); box-shadow:0 0 20px var(--tube-glow); }
        .search-container button:active { transform:scale(0.97); }

        /* ── PAGES ── */
        .page { display:none; }
        .page.active { display:block; animation:pageIn 0.4s cubic-bezier(.2,.8,.2,1); }
        @keyframes pageIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

        .container { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; padding:24px 20px 100px; }

        /* ── HERO ── */
        .hero { display:flex; flex-direction:column; align-items:center; padding:40px 20px 20px; text-align:center; width:100%; }
        .hero-icon {
            width:76px; height:76px; border-radius:22px;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            display:flex; align-items:center; justify-content:center;
            font-size:34px; margin-bottom:22px;
            box-shadow:0 20px 60px rgba(255,59,59,0.3);
            animation:heroIconPulse 3s ease-in-out infinite;
            transition:background 0.5s ease, box-shadow 0.5s ease;
        }
        @keyframes heroIconPulse {
            0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}
        }
        .hero h1 { font-size:38px; font-weight:800; letter-spacing:-1px; }
        .hero h1 span { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; transition:all 0.5s; }
        .hero p { margin-top:10px; color:var(--text-muted); font-size:15px; max-width:380px; line-height:1.6; }

        /* ── VIDEO PLAYER ── */
        #video-display { width:100%; max-width:920px; display:none; animation:slideDown 0.5s cubic-bezier(.2,.8,.2,1); margin-bottom:10px; }
        @keyframes slideDown { from{opacity:0;transform:translateY(-22px) scale(0.98)} to{opacity:1;transform:translateY(0) scale(1)} }
        .player-glass {
            background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:18px; overflow:hidden;
            backdrop-filter:blur(20px);
            box-shadow:0 24px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.04),inset 0 1px 0 rgba(255,255,255,0.07);
            padding:3px;
        }
        .player-wrapper { position:relative; padding-top:56.25%; border-radius:15px; overflow:hidden; background:#000; }
        .player-wrapper iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
        #playing-title { margin:14px 4px 6px; font-size:17px; font-weight:600; line-height:1.4; color:rgba(255,255,255,0.92); }

        /* ── RESULTS LABEL ── */
        .results-label {
            width:100%; max-width:1200px; display:flex; align-items:center; gap:10px;
            margin:18px 0 14px; font-size:12px; color:var(--text-muted); font-weight:600;
            letter-spacing:0.08em; text-transform:uppercase;
        }
        .results-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--glass-border),transparent); }

        /* ── RESULTS GRID ── */
        .results-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(262px,1fr)); gap:16px; width:100%; max-width:1200px; }

        /* ── VIDEO CARD ── */
        .video-card {
            cursor:pointer;
            background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:14px; overflow:hidden;
            backdrop-filter:blur(16px);
            transition:transform 0.3s cubic-bezier(.2,.8,.2,1),box-shadow 0.3s ease,border-color 0.3s ease;
            animation:cardIn 0.45s cubic-bezier(.2,.8,.2,1) both;
            position:relative;
        }
        .video-card::before { content:''; position:absolute; inset:0; border-radius:14px; background:linear-gradient(135deg,rgba(255,255,255,0.05) 0%,transparent 60%); pointer-events:none; z-index:1; }
        @keyframes cardIn { from{opacity:0;transform:translateY(18px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
        .video-card:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 20px 55px rgba(0,0,0,0.5),0 0 0 1px rgba(255,59,59,0.25); border-color:rgba(255,59,59,0.3); }

        body.music-mode .video-card:hover { box-shadow:0 20px 55px rgba(0,0,0,0.5),0 0 0 1px rgba(29,185,84,0.25); border-color:rgba(29,185,84,0.3); }

        .thumb-wrap { position:relative; overflow:hidden; }
        .thumb-wrap img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; transition:transform 0.4s ease; background: #151525; }
        .video-card:hover .thumb-wrap img { transform:scale(1.06); }
        .play-overlay { position:absolute; inset:0; background:rgba(0,0,0,0); display:flex; align-items:center; justify-content:center; transition:background 0.3s ease; }
        .play-btn {
            width:50px; height:50px; border-radius:50%;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            display:flex; align-items:center; justify-content:center;
            font-size:18px; opacity:0; transform:scale(0.5);
            transition:all 0.3s cubic-bezier(.2,.8,.2,1);
            box-shadow:0 8px 24px rgba(0,0,0,0.5);
        }
        .video-card:hover .play-overlay { background:rgba(0,0,0,0.45); }
        .video-card:hover .play-btn { opacity:1; transform:scale(1); }
        .card-body { padding:11px 13px 13px; position:relative; z-index:2; }
        .card-body h3 { font-size:13px; font-weight:600; color:rgba(255,255,255,0.9); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .card-body .channel { font-size:11.5px; color:var(--text-muted); margin-top:5px; display:flex; align-items:center; gap:6px; }
        .channel-dot { width:5px; height:5px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); flex-shrink:0; transition:background 0.5s; }

        /* ── MUSIC MINI PLAYER ── */
        #mini-player {
            position:fixed; bottom:0; left:0; right:0; z-index:300;
            background:rgba(8,8,16,0.85); backdrop-filter:blur(28px) saturate(180%);
            border-top:1px solid rgba(29,185,84,0.25);
            padding:10px 28px; display:none;
            align-items:center; gap:20px;
            box-shadow:0 -8px 40px rgba(0,0,0,0.5);
            animation:playerIn 0.4s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes playerIn { from{transform:translateY(80px);opacity:0} to{transform:translateY(0);opacity:1} }

        .mini-thumb { width:48px; height:48px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--glass-border); }
        .mini-info { flex:1; min-width:0; }
        .mini-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mini-channel { font-size:11px; color:var(--text-muted); margin-top:2px; }

        .mini-controls { display:flex; align-items:center; gap:12px; }
        .ctrl-btn {
            width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
            background:rgba(255,255,255,0.08); color:white; font-size:14px;
            display:flex; align-items:center; justify-content:center;
            transition:all 0.2s ease;
        }
        .ctrl-btn:hover { background:rgba(29,185,84,0.3); transform:scale(1.1); }
        .ctrl-btn.play-pause {
            width:42px; height:42px; font-size:16px;
            background:linear-gradient(135deg,#1db954,#00c9ff);
            box-shadow:0 4px 18px rgba(29,185,84,0.4);
        }
        .ctrl-btn.play-pause:hover { filter:brightness(1.15); transform:scale(1.08); }

        .mini-progress { flex:2; max-width:300px; display:flex; align-items:center; gap:8px; }
        .progress-bar { flex:1; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; cursor:pointer; position:relative; overflow:hidden; }
        .progress-fill { height:100%; background:linear-gradient(90deg,#1db954,#00c9ff); border-radius:2px; width:0%; transition:width 0.5s linear; }
        .time-label { font-size:11px; color:var(--text-muted); white-space:nowrap; }

        .mini-close { width:28px; height:28px; border-radius:50%; border:none; cursor:pointer; background:rgba(255,255,255,0.06); color:var(--text-muted); font-size:12px; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
        .mini-close:hover { background:rgba(255,59,59,0.25); color:white; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.13); border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:rgba(255,59,59,0.4); }

        @media(max-width:680px) {
            nav { flex-wrap:wrap; height:auto; padding:10px 14px; gap:8px; justify-content: center; }
            .search-container { width:100%; order:3; }
            .nav-tabs { order:2; }
            .mini-progress { display:none; }
        }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
</div>

<div id="loader-bar"></div>

<nav>
    <div class="logo">
        <span class="logo-name" id="logo-name">Nachyn</span>
        <span class="logo-badge" id="logo-badge">Tube</span>
    </div>

    <div class="nav-tabs">
        <div class="nav-tab tube-tab active" id="tab-tube" onclick="switchPage('tube')">
            <span class="tab-icon">▶</span> NachynTube
        </div>
        <div class="nav-tab music-tab" id="tab-music" onclick="switchPage('music')">
            <span class="tab-icon">♪</span> NachynMusic
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Cari video...">
        <button id="search-btn" onclick="doSearch()">Cari</button>
    </div>
</nav>

<div class="page active" id="page-tube">
    <div class="container">
        <div class="hero" id="tube-hero">
            <div class="hero-icon">▶</div>
            <h1>Selamat Datang di <span>NachynTube</span></h1>
            <p>Cari video favoritmu dan nikmati streaming tanpa batas</p>
        </div>
        <div id="video-display">
            <div class="player-glass">
                <div class="player-wrapper" id="player"></div>
            </div>
            <h2 id="playing-title"></h2>
        </div>
        <div class="results-label" id="tube-label">Rekomendasi Video</div>
        <div class="results-grid" id="tube-results"></div>
    </div>
</div>

<div class="page" id="page-music">
    <div class="container">
        <div class="hero" id="music-hero">
            <div class="hero-icon" style="background:linear-gradient(135deg,#1db954,#00c9ff);box-shadow:0 20px 60px rgba(29,185,84,0.3);">♪</div>
            <h1>Selamat Datang di <span style="background:linear-gradient(90deg,#1db954,#00c9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">NachynMusic</span></h1>
            <p>Dengarkan musik favoritmu dengan player yang kece</p>
        </div>
        <div class="results-label" id="music-label">Rekomendasi Musik</div>
        <div class="results-grid" id="music-results"></div>
    </div>
</div>

<div id="mini-player">
    <img class="mini-thumb" id="mini-thumb" src="" alt="">
    <div class="mini-info">
        <div class="mini-title" id="mini-title">—</div>
        <div class="mini-channel" id="mini-channel">—</div>
    </div>
    <div class="mini-controls">
        <button class="ctrl-btn" onclick="prevTrack()" title="Sebelumnya">⏮</button>
        <button class="ctrl-btn play-pause" id="pp-btn" onclick="togglePlay()">⏸</button>
        <button class="ctrl-btn" onclick="nextTrack()" title="Berikutnya">⏭</button>
    </div>
    <div class="mini-progress">
        <span class="time-label" id="time-cur">0:00</span>
        <div class="progress-bar" id="prog-bar" onclick="seekTrack(event)">
            <div class="progress-fill" id="prog-fill"></div>
        </div>
        <span class="time-label" id="time-dur">0:00</span>
    </div>
    <button class="mini-close" onclick="closeMiniPlayer()" title="Tutup">✕</button>
</div>

<script>
// MASUKKAN API KEY BARU KAMU YANG AKTIF DI BAWAH INI (BARIS 222)
const API_KEY = 'AIzaSyDkxB1zAcA_fRz7Toi_9A68FJhH5eOTBZY'; 
const loader = document.getElementById('loader-bar');
let currentPage = 'tube';

// Music state
let musicQueue = [];
let currentTrackIdx = 0;
let isPlaying = false;
let progressInterval = null;
let currentSec = 0;
let durationSec = 0;

// Jalankan otomatis saat web dibuka pertama kali
window.addEventListener('DOMContentLoaded', () => {
    loadTrendingVideos();
    loadTrendingMusic();
});

// ── LOADER ──
function showLoading() {
    loader.style.width = '30%';
    setTimeout(() => loader.style.width = '72%', 200);
}
function hideLoading() {
    loader.style.width = '100%';
    setTimeout(() => loader.style.width = '0%', 450);
}

// ── PAGE SWITCH ──
function switchPage(page) {
    currentPage = page;
    document.getElementById('page-tube').classList.toggle('active', page === 'tube');
    document.getElementById('page-music').classList.toggle('active', page === 'music');
    document.getElementById('tab-tube').classList.toggle('active', page === 'tube');
    document.getElementById('tab-music').classList.toggle('active', page === 'music');

    document.body.classList.toggle('music-mode', page === 'music');

    // logo
    document.getElementById('logo-badge').textContent = page === 'tube' ? 'Tube' : 'Music';
    document.getElementById('logo-badge').style.background = page === 'tube'
        ? 'linear-gradient(135deg,#ff3b3b,#ff8c42)'
        : 'linear-gradient(135deg,#1db954,#00c9ff)';

    // search placeholder
    document.getElementById('search-input').placeholder = page === 'tube' ? 'Cari video...' : 'Cari lagu / artis...';
    document.getElementById('search-btn').style.background = page === 'tube'
        ? 'linear-gradient(135deg,#ff3b3b,#ff8c42)'
        : 'linear-gradient(135deg,#1db954,#00c9ff)';
}

// ── SEARCH ──
function doSearch() {
    if (currentPage === 'tube') searchTube();
    else searchMusic();
}

// ── BERANDA AWAL VIDEO (TRENDING INDONESIA) ──
async function loadTrendingVideos() {
    const grid = document.getElementById('tube-results');
    try {
        const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&regionCode=ID&maxResults=12&key=${API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
            grid.innerHTML = `<p style="color:#ff3b3b;grid-column:1/-1;text-align:center;padding:40px;line-height:1.6;">API Error: ${data.error.message}<br><span style="color:var(--text-muted)">Silakan cek atau ganti API Key kamu di baris 222 karena key lama mati/habis kuota.</span></p>`;
            return;
        }

        grid.innerHTML = '';
        data.items.forEach((item, i) => {
            renderVideoCard(grid, item, i, 'tube');
        });
    } catch(e) {
        grid.innerHTML = '<p style="color:#ff3b3b;grid-column:1/-1;text-align:center;padding:40px">Gagal memuat beranda. Periksa API Key kamu.</p>';
    }
}

// ── BERANDA AWAL MUSIK ──
async function loadTrendingMusic() {
    const grid = document.getElementById('music-results');
    try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=lagu%20pop%20indonesia%20terbaru&type=video&key=${API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
            grid.innerHTML = `<p style="color:#ff3b3b;grid-column:1/-1;text-align:center;padding:40px">Gagal memuat musik karena masalah API Key.</p>`;
            return;
        }

        grid.innerHTML = '';
        musicQueue = [];
        data.items.forEach((item, i) => {
            if(!item.id?.videoId) return;
            musicQueue.push({
                id: item.id.videoId,
                title: item.snippet.title,
                channel: item.snippet.channelTitle,
                thumb: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.medium?.url || ''
            });
            renderVideoCard(grid, item, i, 'music');
        });
    } catch(e) {
        grid.innerHTML = '<p style="color:#ff3b3b;grid-column:1/-1;text-align:center;padding:40px">Gagal memuat rekomendasi musik.</p>';
    }
}

// ── PILAR UTAMA TUBE SEARCH ──
async function searchTube() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    showLoading();
    document.getElementById('tube-hero').style.display = 'none';
    document.getElementById('tube-label').textContent = 'Hasil Pencarian';

    const grid = document.getElementById('tube-results');
    grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px">Mencari video...</p>';

    try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(q)}&type=video&key=${API_KEY}`;
        const data = await (await fetch(url)).json();
        grid.innerHTML = '';
        if (!data.items?.length) { grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px">Tidak ada hasil ditemukan.</p>'; hideLoading(); return; }
        
        data.items.forEach((item, i) => {
            if(item.id?.videoId) renderVideoCard(grid, item, i, 'tube');
        });
    } catch(e) { grid.innerHTML = '<p style="color:#ff3b3b;grid-column:1/-1;text-align:center;padding:40px">Error koneksi / Gagal memuat.</p>'; }
    hideLoading();
}

// ── PILAR UTAMA MUSIC SEARCH ──
async function searchMusic() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    showLoading();
    document.getElementById('music-hero').style.display = 'none';
    document.getElementById('music-label').textContent = 'Hasil Pencarian';

    const grid = document.getElementById('music-results');
    grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px">Mencari musik...</p>';

    try {
        // DIKOREKSI: Menghapus videoCategoryId agar pencarian lagu tidak dibatasi ketat oleh YouTube
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${encodeURIComponent(q + ' music')}&type=video&key=${API_KEY}`;
        const data = await (await fetch(url)).json();
        grid.innerHTML = '';
        musicQueue = [];
        if (!data.items?.length) { grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px">Tidak ada hasil ditemukan.</p>'; hideLoading(); return; }

        data.items.forEach((item, i) => {
            if(!item.id?.videoId) return;
            musicQueue.push({
                id: item.id.videoId,
                title: item.snippet.title,
                channel: item.snippet.channelTitle,
                thumb: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.medium?.url || ''
            });
            renderVideoCard(grid, item, i, 'music');
        });
    } catch(e) { grid.innerHTML = '<p style="color:#ff3b3b;grid-column:1/-1;text-align:center;padding:40px">Error saat mencari musik.</p>'; }
    hideLoading();
}

// HELPER: RENDER KARTU VIDEO
function renderVideoCard(grid, item, i, mode) {
    const title = item.snippet?.title || 'No Title';
    const channel = item.snippet?.channelTitle || 'Unknown Channel';
    const thumb = item.snippet?.thumbnails?.high?.url || item.snippet?.thumbnails?.medium?.url || '';
    const id = item.id?.videoId || item.id; // handle search vs video list object response

    if(!id) return;

    const c = document.createElement('div');
    c.className = 'video-card';
    c.style.animationDelay = `${i*0.04}s`;
    
    const iconPlay = mode === 'tube' ? '▶' : '♪';
    const gradientOverlay = mode === 'tube' ? '' : 'style="background:linear-gradient(135deg,#1db954,#00c9ff)"';
    const dotGradient = mode === 'tube' ? '' : 'style="background:linear-gradient(135deg,#1db954,#00c9ff)"';

    c.innerHTML = `
        <div class="thumb-wrap">
            <img src="${thumb}" alt="" loading="lazy">
            <div class="play-overlay"><div class="play-btn" ${gradientOverlay}>${iconPlay}</div></div>
        </div>
        <div class="card-body">
            <h3>${title}</h3>
            <div class="channel"><span class="channel-dot" ${dotGradient}></span>${channel}</div>
        </div>`;
    
    if (mode === 'tube') {
        c.onclick = () => playTubeVideo(id, title);
    } else {
        const queueIndex = musicQueue.findIndex(m => m.id === id);
        c.onclick = () => playMusicTrack(queueIndex >= 0 ? queueIndex : 0);
    }
    grid.appendChild(c);
}

function playTubeVideo(id, title) {
    showLoading();
    const display = document.getElementById('video-display');
    display.style.display = 'block';
    display.style.animation = 'none'; void display.offsetWidth; display.style.animation = 'slideDown 0.5s cubic-bezier(.2,.8,.2,1)';
    document.getElementById('playing-title').innerText = title;
    document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
    window.scrollTo({top:0, behavior:'smooth'});
    hideLoading();
}

// ── MUSIC PLAYER ──
function playMusicTrack(idx) {
    currentTrackIdx = idx;
    const track = musicQueue[idx];
    if (!track) return;

    // Show mini player
    const mp = document.getElementById('mini-player');
    mp.style.display = 'flex';
    document.getElementById('mini-thumb').src = track.thumb;
    document.getElementById('mini-title').textContent = track.title;
    document.getElementById('mini-channel').textContent = track.channel;
    document.getElementById('pp-btn').textContent = '⏸';
    isPlaying = true;

    // Reset progress
    currentSec = 0; durationSec = 210; // default ~3.5 min
    document.getElementById('prog-fill').style.width = '0%';
    document.getElementById('time-cur').textContent = '0:00';
    document.getElementById('time-dur').textContent = fmtTime(durationSec);

    // Hidden iframe container
    let container = document.getElementById('music-iframe-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'music-iframe-container';
        container.style.cssText = 'position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;';
        document.body.appendChild(container);
    }
    container.innerHTML = `<iframe id="music-iframe" src="https://www.youtube.com/embed/${track.id}?autoplay=1&enablejsapi=1" allow="autoplay;encrypted-media"></iframe>`;

    // Simulate progress Bar
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        if (!isPlaying) return;
        currentSec++;
        if (currentSec >= durationSec) { nextTrack(); return; }
        document.getElementById('prog-fill').style.width = `${(currentSec/durationSec)*100}%`;
        document.getElementById('time-cur').textContent = fmtTime(currentSec);
    }, 1000);

    // Highlight active card
    document.querySelectorAll('#music-results .video-card').forEach((c,i) => {
        c.style.borderColor = i === idx ? 'rgba(29,185,84,0.5)' : '';
        c.style.boxShadow = i === idx ? '0 0 20px rgba(29,185,84,0.2)' : '';
    });
}

function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('pp-btn').textContent = isPlaying ? '⏸' : '▶';
    const iframe = document.getElementById('music-iframe');
    if (iframe) {
        const src = iframe.src;
        if (!isPlaying) iframe.src = '';
        else iframe.src = src || `https://www.youtube.com/embed/${musicQueue[currentTrackIdx]?.id}?autoplay=1&enablejsapi=1`;
    }
}

function nextTrack() {
    if (musicQueue.length === 0) return;
    playMusicTrack((currentTrackIdx + 1) % musicQueue.length);
}

function prevTrack() {
    if (musicQueue.length === 0) return;
    if (currentSec > 4) { currentSec = 0; return; }
    playMusicTrack((currentTrackIdx - 1 + musicQueue.length) % musicQueue.length);
}

function seekTrack(e) {
    const bar = document.getElementById('prog-bar');
    const ratio = e.offsetX / bar.offsetWidth;
    currentSec = Math.floor(ratio * durationSec);
    document.getElementById('prog-fill').style.width = `${ratio*100}%`;
    document.getElementById('time-cur').textContent = fmtTime(currentSec);
}

function closeMiniPlayer() {
    clearInterval(progressInterval);
    isPlaying = false;
    document.getElementById('mini-player').style.display = 'none';
    const c = document.getElementById('music-iframe-container');
    if (c) c.innerHTML = '';
    document.querySelectorAll('#music-results .video-card').forEach(c => { c.style.borderColor=''; c.style.boxShadow=''; });
}

function fmtTime(s) {
    const m = Math.floor(s/60);
    return `${m}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

// ── ENTER KEY ──
document.getElementById('search-input').addEventListener('keypress', e => {
    if (e.key === 'Enter') doSearch();
});
</script>
