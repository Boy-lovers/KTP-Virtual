<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NachynTube Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f0f0f; color: white; overflow-x: hidden; }

        /* INTRO LOADING 10 DETIK */
        #intro-loader {
            position: fixed; inset: 0; background: #0f0f0f;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; transition: opacity 0.8s ease;
        }
        .intro-logo { font-size: 40px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }
        .intro-logo span { background: #ff0000; padding: 2px 10px; border-radius: 8px; margin-left: 5px; }
        
        .load-box { width: 250px; height: 4px; background: #333; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .load-fill { width: 0%; height: 100%; background: #ff0000; animation: progress 10s linear forwards; }
        #load-text { color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }

        @keyframes progress { to { width: 100%; } }

        /* NAVBAR */
        nav {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: rgba(15, 15, 15, 0.98); display: flex;
            align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid #222;
        }
        .search-bar { display: flex; flex: 0 1 600px; margin: 0 20px; }
        .search-bar input {
            flex: 1; padding: 10px 15px; background: #121212; border: 1px solid #333;
            color: white; border-radius: 40px 0 0 40px; outline: none;
        }
        .search-bar button {
            padding: 0 20px; background: #222; border: 1px solid #333; border-left: none;
            color: white; border-radius: 0 40px 40px 0; cursor: pointer;
        }

        /* LAYOUT */
        .main-content { padding: 80px 20px 20px; max-width: 1600px; margin: 0 auto; }
        
        /* PLAYER */
        #player-section { display: none; margin-bottom: 40px; animation: slideIn 0.5s ease; }
        .video-wrapper { position: relative; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* GRID */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .card-info { display: flex; gap: 12px; margin-top: 10px; }
        .card-info h3 { font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-info p { color: #aaa; font-size: 12px; margin-top: 5px; }

        /* SIDEBAR MENU */
        #sidebar {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: #0f0f0f; z-index: 2000; padding: 30px 20px;
            transition: 0.3s; border-left: 1px solid #222;
        }
        #sidebar.open { right: 0; }
        .menu-btn { cursor: pointer; padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 15px; }
        .menu-btn:hover { background: #222; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* HP MODE MIRING (LANDSCAPE) */
        @media (orientation: landscape) and (max-width: 900px) {
            nav { display: none; }
            .main-content { padding: 0; }
            .video-wrapper { border-radius: 0; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="intro-loader">
        <div class="intro-logo">Nachyn<span>Tube</span></div>
        <div class="load-box"><div class="load-fill"></div></div>
        <div id="load-text">Menghubungkan ke Server...</div>
    </div>

    <nav>
        <div class="intro-logo" style="font-size: 20px; cursor: pointer;" onclick="location.reload()">Nachyn<span>Tube</span></div>
        <div class="search-bar">
            <input type="text" id="q" placeholder="Cari video gratis tanpa iklan...">
            <button onclick="search()"><i class="fas fa-search"></i></button>
        </div>
        <div onclick="toggleMenu()" style="cursor:pointer; font-size: 20px;"><i class="fas fa-bars"></i></div>
    </nav>

    <div id="sidebar">
        <h2 style="margin-bottom: 20px;">Nachyn Menu</h2>
        <div class="menu-btn" onclick="location.reload()"><i class="fas fa-home"></i> Beranda</div>
        <div class="menu-btn" onclick="tagSearch('Trending')"><i class="fas fa-fire"></i> Trending</div>
        <div class="menu-btn" onclick="tagSearch('Music')"><i class="fas fa-music"></i> Musik</div>
        <div style="margin-top: 20px; padding: 10px; background: #1a1a1a; border-radius: 8px; color: #ff0000; font-size: 12px; text-align: center; border: 1px solid red;">
            PREMIUM ACTIVE
        </div>
    </div>

    <div class="main-content">
        <div id="player-section">
            <div class="video-wrapper" id="player-anchor"></div>
            <h2 id="vid-title" style="margin-top: 15px; font-size: 18px;"></h2>
        </div>
        <div class="video-grid" id="results"></div>
    </div>

    <script>
        const API_KEY = 'AIzaSyDcY-7czDHgxYjCe6wvjZhusV-4DSBXGkM'; // <--- JANGAN LUPA ISI!

        // 1. Logic Loading 10 Detik & Teks Animasi
        const texts = ["Menganalisis Akun Premium...", "Menghilangkan Iklan...", "Mengoptimalkan Buffer...", "Siap Menonton!"];
        let textIdx = 0;
        const textElem = document.getElementById('load-text');
        
        const interval = setInterval(() => {
            textElem.innerText = texts[textIdx];
            textIdx = (textIdx + 1) % texts.length;
        }, 2500);

        window.onload = () => {
            setTimeout(() => {
                clearInterval(interval);
                document.getElementById('intro-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('intro-loader').style.display = 'none', 800);
            }, 10000);
        };

        // 2. Fungsi Menu
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        function tagSearch(t) { document.getElementById('q').value = t; toggleMenu(); search(); }

        // 3. Fungsi Cari
        async function search() {
            const query = document.getElementById('q').value;
            if(!query) return;
            
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`);
                const data = await res.json();
                
                const grid = document.getElementById('results');
                grid.innerHTML = '';

                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${item.snippet.thumbnails.high.url}">
                        <div class="card-info">
                            <div style="width:35px; height:35px; background:red; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${item.snippet.channelTitle[0]}</div>
                            <div>
                                <h3>${item.snippet.title}</h3>
                                <p>${item.snippet.channelTitle}</p>
                            </div>
                        </div>`;
                    card.onclick = () => play(item.id.videoId, item.snippet.title);
                    grid.appendChild(card);
                });
            } catch (e) { alert("API Error! Cek API Key lo."); }
        }

        // 4. Fungsi Play Video (Anti Gagal)
        function play(id, title) {
            window.scrollTo({top: 0, behavior: 'smooth'});
            document.getElementById('player-section').style.display = 'block';
            document.getElementById('vid-title').innerText = title;
            
            // Menggunakan teknik 'origin' supaya YouTube mau muter video di file lokal/hosting
            const origin = window.location.origin === "null" ? "*" : window.location.origin;
            
            document.getElementById('player-anchor').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1&origin=${origin}&rel=0" 
                frameborder="0" allow="autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }

        document.getElementById('q').onkeypress = (e) => { if(e.key === 'Enter') search(); };
    </script>
</body>
</html>
