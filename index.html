<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NachynTube - Premium Streaming</title>
    <style>
        /* CSS RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
        body { background-color: #0f0f0f; color: white; overflow-x: hidden; scroll-behavior: smooth; }

        /* LOADING ANIMATION (ALA YOUTUBE) */
        #loader-bar {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: #ff0000; z-index: 9999; transition: width 0.3s ease-out;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }

        /* NAVBAR - FIXED TOP */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(15, 15, 15, 0.95);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
        }
        .logo { font-size: 20px; font-weight: bold; color: white; display: flex; align-items: center; text-decoration: none; transition: transform 0.2s; }
        .logo:active { transform: scale(0.95); }
        .logo span { background: #ff0000; color: white; padding: 2px 8px; border-radius: 4px; margin-left: 5px; font-weight: 800; }

        .search-container { display: flex; width: 45%; max-width: 600px; }
        .search-container input {
            width: 100%; padding: 10px 18px; border: 1px solid #333;
            background: #121212; color: white; border-radius: 40px 0 0 40px;
            outline: none; font-size: 14px; transition: border-color 0.3s;
        }
        .search-container input:focus { border-color: #ff0000; }
        .search-container button {
            padding: 0 20px; border: 1px solid #333; border-left: none; background: #222; color: white;
            border-radius: 0 40px 40px 0; cursor: pointer; transition: background 0.2s;
        }
        .search-container button:active { background: #333; }

        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-right button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; transition: transform 0.2s; }
        .nav-right button:active { transform: scale(0.9); }

        /* MAIN CONTAINER - PADDING UNTUK NAVBAR */
        .container { display: flex; flex-direction: column; align-items: center; padding: 80px 10px 20px 10px; }

        /* VIDEO PLAYER SECTION */
        #video-display {
            width: 100%; max-width: 860px; display: none;
            animation: slideDownIn 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            margin-bottom: 30px;
        }
        @keyframes slideDownIn {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .player-wrapper {
            position: relative; padding-top: 56.25%; /* 16:9 */
            background: black; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.05);
        }
        .player-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* GRID VIDEO HASIL */
        .results-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; width: 100%; max-width: 1400px;
        }
        
        /* CARD VIDEO WITH SMOOTH ANIMATIONS */
        .video-card {
            cursor: pointer; position: relative;
            animation: cardAppear 0.5s ease backwards;
        }
        
        /* Memberikan jeda animasi untuk setiap kartu */
        .video-card:nth-child(1) { animation-delay: 0.1s; }
        .video-card:nth-child(2) { animation-delay: 0.2s; }
        .video-card:nth-child(3) { animation-delay: 0.3s; }
        .video-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .thumbnail-container {
            position: relative; overflow: hidden; border-radius: 12px;
            aspect-ratio: 16/9; transition: box-shadow 0.3s;
        }
        .video-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        /* Hover Effect */
        .video-card:hover .thumbnail-container { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-card:hover img { transform: scale(1.1); }
        .video-card:active { transform: scale(0.98); transition: transform 0.1s; }

        .video-info { display: flex; gap: 12px; margin-top: 12px; padding: 0 4px; }
        .channel-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: #333;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; text-transform: uppercase;
        }
        .text-info { flex: 1; }
        .video-card h3 { font-size: 14px; color: #fff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
        .video-card p { font-size: 12px; color: #aaa; margin-top: 4px; }

        /* MODAL SIDEBAR (SETTINGS MENU) */
        #menu-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; display: none;
            opacity: 0; transition: opacity 0.3s ease;
        }
        #menu-modal.show { display: block; opacity: 1; }
        .menu-content {
            position: absolute; top: 0; right: 0; width: 280px; height: 100%;
            background: #181818; padding: 30px 20px;
            transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        #menu-modal.show .menu-content { transform: translateX(0); }
        .menu-close { position: absolute; top: 15px; left: 15px; background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; }
        .menu-content h2 { font-size: 18px; margin-bottom: 25px; color: #fff; text-align: center; }
        .menu-item {
            display: flex; align-items: center; gap: 15px;
            padding: 12px 15px; border-radius: 8px; color: #eee;
            cursor: pointer; text-decoration: none; transition: background 0.2s;
        }
        .menu-item:hover { background: #333; }
        .menu-item i { font-size: 18px; width: 20px; text-align: center; }

        /* RESPONSIVE CSS - KHUSUS UNTUK HP */
        @media (max-width: 768px) {
            nav { padding: 10px 12px; }
            .logo { font-size: 18px; }
            .logo span { padding: 2px 6px; border-radius: 3px; }
            
            .search-container {
                position: fixed; top: 60px; left: 0; width: 100%; max-width: 100%;
                padding: 10px 15px; background: #0f0f0f; border-bottom: 1px solid #222;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                border-radius: 0; animation: searchFadeIn 0.3s;
            }
            @keyframes searchFadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
            
            .search-container input { border-radius: 40px; }
            .search-container button {
                position: absolute; right: 25px; top: 50%; transform: translateY(-50%);
                border: none; background: none; color: #ff0000;
            }

            .container { padding-top: 130px; } /* Menambah padding untuk kotak search baru */
            .nav-right { gap: 10px; }
            .nav-right button { font-size: 18px; }
            
            .results-grid { grid-template-columns: 1fr; gap: 15px; }
            .player-wrapper { border-radius: 0; border: none; }
            #video-display { margin-bottom: 15px; }
            #playing-title { padding: 0 10px; font-size: 16px !important; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="loader-bar"></div>

    <nav>
        <a href="#" class="logo">Nachyn<span>Tube</span></a>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Cari video premium...">
            <button onclick="searchVideo()"><i class="fas fa-search"></i></button>
        </div>
        <div class="nav-right">
            <button id="search-toggle-btn" style="display: none;"><i class="fas fa-search"></i></button>
            <button><i class="fas fa-bell"></i></button>
            <button onclick="toggleMenu()"><i class="fas fa-bars"></i></button> </div>
    </nav>

    <div class="container">
        <div id="video-display">
            <div class="player-wrapper" id="player"></div>
            <h2 id="playing-title" style="margin: 15px 0 10px 0; font-size: 20px; font-weight: 500;"></h2>
            <p id="playing-channel" style="color: #aaa; font-size: 14px; margin-bottom: 25px;"></p>
        </div>

        <div class="results-grid" id="results"></div>
    </div>

    <div id="menu-modal" onclick="closeMenu()">
        <div class="menu-content" onclick="event.stopPropagation()">
            <button class="menu-close" onclick="closeMenu()">&times;</button>
            <h2>Menu NachynTube</h2>
            
            <a href="#" class="menu-item"><i class="fas fa-home"></i> Beranda</a>
            <a href="#" class="menu-item"><i class="fas fa-fire"></i> Trending</a>
            <a href="#" class="menu-item"><i class="fas fa-thumbs-up"></i> Video Disukai</a>
            <a href="#" class="menu-item"><i class="fas fa-history"></i> Riwayat</a>
            <div style="border-bottom: 1px solid #333; margin: 15px 0;"></div>
            <a href="#" class="menu-item"><i class="fas fa-cog"></i> Pengaturan</a>
            <a href="#" class="menu-item"><i class="fas fa-check-circle" style="color:#ff0000"></i> Status Premium</a>
        </div>
    </div>

    <script>
        // GANTI DENGAN API KEY LO DI SINI
        const API_KEY = 'AIzaSyDcY-7czDHgxYjCe6wvjZhusV-4DSBXGkM';

        const loader = document.getElementById('loader-bar');

        // Fungsi Loading Smooth ala YouTube
        function showLoading() {
            loader.style.width = '20%';
            setTimeout(() => { loader.style.width = '60%'; }, 200);
            setTimeout(() => { loader.style.width = '80%'; }, 500);
        }

        function hideLoading() {
            loader.style.width = '100%';
            setTimeout(() => { 
                loader.style.width = '0%'; 
                setTimeout(() => { loader.style.transition = 'width 0.3s ease-out'; }, 100);
            }, 300);
        }

        // Fungsi Cari Video dengan Efek Card Appear
        async function searchVideo() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            showLoading();

            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = ''; // Clear results

                // Mencegah hasil pencarian kosong
                if (!data.items || data.items.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; width:100%; color:#aaa; padding:20px;">Video tidak ditemukan.</p>';
                    hideLoading();
                    return;
                }

                data.items.forEach((item, index) => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;
                    const thumb = item.snippet.thumbnails.high.url;
                    
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="thumbnail-container">
                            <img src="${thumb}" alt="thumbnail">
                        </div>
                        <div class="video-info">
                            <div class="channel-avatar">${channel.charAt(0)}</div>
                            <div class="text-info">
                                <h3>${title}</h3>
                                <p>${channel}</p>
                            </div>
                        </div>
                    `;
                    card.onclick = () => playVideo(videoId, title, channel);
                    resultsDiv.appendChild(card);
                });
            } catch (error) {
                alert("Gagal mengambil data. Cek API Key lo atau koneksi internet.");
            }

            hideLoading();
        }

        // Fungsi Putar Video dengan Animasi Drop-down
        function playVideo(id, title, channel) {
            showLoading();
            
            const display = document.getElementById('video-display');
            const player = document.getElementById('player');
            const titleElem = document.getElementById('playing-title');
            const channelElem = document.getElementById('playing-channel');

            display.style.display = 'block';
            titleElem.innerText = title;
            channelElem.innerText = channel;

            // Masukin iframe YouTube
            player.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0" 
                    frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen>
                </iframe>
            `;

            // Smooth scroll ke atas
            window.scrollTo({ top: 0, behavior: 'smooth' });

            hideLoading();
        }

        // Fitur Enter untuk Search
        document.getElementById('search-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { searchVideo(); }
        });

        // MENU SIDEBAR FUNCTION
        const menuModal = document.getElementById('menu-modal');
        function toggleMenu() { menuModal.classList.toggle('show'); }
        function closeMenu() { menuModal.classList.remove('show'); }

        // Mencegah kotak pencarian utama hilang di desktop saat me-resize browser
        window.addEventListener('resize', function() {
            const searchContainer = document.querySelector('.search-container');
            if (window.innerWidth > 768) {
                searchContainer.style.display = 'flex';
                searchContainer.style.position = 'static';
                searchContainer.style.padding = '0';
                searchContainer.style.border = 'none';
            } else {
                searchContainer.style = ''; // Reset inline style
            }
        });
    </script>
</body>
</html>
