<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NachynTube Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f0f0f; color: white; overflow-x: hidden; }

        /* INTRO LOADING 10 DETIK */
        #intro-loader {
            position: fixed; inset: 0; background: #0f0f0f;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; transition: opacity 0.8s ease;
        }
        .intro-logo { font-size: 35px; font-weight: 800; }
        .intro-logo span { background: #ff0000; padding: 2px 10px; border-radius: 8px; margin-left: 5px; }
        .load-box { width: 200px; height: 3px; background: #333; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .load-fill { width: 0%; height: 100%; background: #ff0000; animation: progress 10s linear forwards; }
        @keyframes progress { to { width: 100%; } }

        /* NAVBAR */
        nav {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: #0f0f0f; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; z-index: 1000;
            border-bottom: 1px solid #222;
        }
        .search-bar { display: flex; flex: 1; margin: 0 15px; max-width: 500px; }
        .search-bar input {
            flex: 1; padding: 8px 15px; background: #121212; border: 1px solid #333;
            color: white; border-radius: 20px 0 0 20px; outline: none;
        }
        .search-bar button {
            padding: 0 15px; background: #222; border: 1px solid #333; border-left: none;
            color: white; border-radius: 0 20px 20px 0;
        }

        /* MAIN CONTENT */
        .main-content { padding: 75px 15px 20px; }
        
        /* PLAYER FIX */
        #player-section { display: none; margin-bottom: 25px; }
        .video-wrapper { 
            position: relative; padding-top: 56.25%; 
            background: #000; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* GRID */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { cursor: pointer; }
        .card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; margin-bottom: 10px; }
        .card h3 { font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card p { color: #aaa; font-size: 12px; margin-top: 5px; }

        /* SIDEBAR */
        #sidebar {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: #121212; z-index: 2000; padding: 30px 20px; transition: 0.3s;
        }
        #sidebar.open { right: 0; }
        .menu-item { padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover { background: #222; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="intro-loader">
        <div class="intro-logo">Nachyn<span>Tube</span></div>
        <div class="load-box"><div class="load-fill"></div></div>
        <p style="font-size: 10px; color: #555; letter-spacing: 2px;">BYPASSING ADS...</p>
    </div>

    <nav>
        <div class="intro-logo" style="font-size: 18px;" onclick="location.reload()">Nachyn<span>Tube</span></div>
        <div class="search-bar">
            <input type="text" id="q" placeholder="Cari video...">
            <button onclick="search()"><i class="fas fa-search"></i></button>
        </div>
        <div onclick="toggleMenu()" style="cursor:pointer;"><i class="fas fa-bars fa-lg"></i></div>
    </nav>

    <div id="sidebar">
        <h2 style="margin-bottom: 20px;">Menu</h2>
        <div class="menu-item" onclick="location.reload()">Beranda</div>
        <div class="menu-item" onclick="tagSearch('Trending')">Trending</div>
        <div class="menu-item" onclick="tagSearch('Lagu Viral 2026')">Musik</div>
        <div style="margin-top:20px; color:red; font-size:12px;">PREMIUM AKTIF ✅</div>
    </div>

    <div class="main-content">
        <div id="player-section">
            <div class="video-wrapper" id="player-anchor"></div>
            <h2 id="vid-title" style="margin-top: 15px; font-size: 16px;"></h2>
        </div>
        <div class="video-grid" id="results"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script>
        const API_KEY = 'AIzaSyDcY-7czDHgxYjCe6wvjZhusV-4DSBXGkM'; // GANTI INI!

        // Loading 10 Detik
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('intro-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('intro-loader').style.display = 'none', 800);
            }, 10000);
        };

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        function tagSearch(t) { document.getElementById('q').value = t; toggleMenu(); search(); }

        async function search() {
            const query = document.getElementById('q').value;
            if(!query) return;
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('results');
            grid.innerHTML = '';
            data.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.snippet.thumbnails.high.url}"><h3>${item.snippet.title}</h3><p>${item.snippet.channelTitle}</p>`;
                card.onclick = () => play(item.id.videoId, item.snippet.title);
                grid.appendChild(card);
            });
        }

        function play(id, title) {
            window.scrollTo({top: 0, behavior: 'smooth'});
            document.getElementById('player-section').style.display = 'block';
            document.getElementById('vid-title').innerText = title;
            
            // GUNAKAN INI SUPAYA TEMBUS BLOKIR
            document.getElementById('player-anchor').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" 
                frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }

        document.getElementById('q').onkeypress = (e) => { if(e.key === 'Enter') search(); };
    </script>
</body>
</html>
