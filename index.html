<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NachynTube - Premium Streaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
        body { background-color: #0f0f0f; color: white; overflow-x: hidden; scroll-behavior: smooth; }

        /* 10 DETIK INTRO LOADING SCREEN */
        #intro-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0f0f; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
            transition: opacity 1s ease, visibility 1s;
        }
        .intro-logo { font-size: 35px; font-weight: bold; margin-bottom: 20px; }
        .intro-logo span { background: #ff0000; color: white; padding: 4px 12px; border-radius: 6px; margin-left: 5px; }
        
        /* Progress Bar Loading */
        .loader-container { width: 200px; height: 4px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .loader-fill { width: 0%; height: 100%; background: #ff0000; animation: fillProgress 10s linear forwards; }
        
        @keyframes fillProgress { from { width: 0%; } to { width: 100%; } }

        /* LOADING BAR ATAS (SAAT CARI VIDEO) */
        #loader-bar {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: #ff0000; z-index: 9999; transition: width 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }

        /* NAVBAR */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: #0f0f0f;
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            border-bottom: 1px solid #222;
        }
        .logo { font-size: 20px; font-weight: bold; color: white; text-decoration: none; display: flex; align-items: center; cursor: pointer; }
        .logo span { background: #ff0000; color: white; padding: 2px 8px; border-radius: 4px; margin-left: 5px; }

        .search-container { display: flex; width: 45%; max-width: 600px; }
        .search-container input {
            width: 100%; padding: 10px 18px; border: 1px solid #333;
            background: #121212; color: white; border-radius: 40px 0 0 40px; outline: none;
        }
        .search-container button {
            padding: 0 20px; border: 1px solid #333; border-left: none; background: #222; 
            color: white; border-radius: 0 40px 40px 0; cursor: pointer;
        }

        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-right button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

        /* MAIN CONTENT */
        .container { display: flex; flex-direction: column; align-items: center; padding: 80px 10px 20px 10px; }

        /* PLAYER AREA */
        #video-display { width: 100%; max-width: 900px; display: none; margin-bottom: 30px; animation: slideIn 0.5s ease; }
        .player-wrapper { position: relative; padding-top: 56.25%; background: black; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* VIDEO GRID */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 1400px; margin-top: 20px; }
        .video-card { cursor: pointer; transition: 0.3s; }
        .video-card:hover { transform: translateY(-5px); }
        .video-card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .video-info { display: flex; gap: 12px; margin-top: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #444; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .text-info h3 { font-size: 14px; color: #fff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .text-info p { font-size: 12px; color: #aaa; margin-top: 4px; }

        /* SIDEBAR */
        #menu-sidebar {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: #181818; z-index: 2000; transition: 0.4s; padding: 20px;
        }
        #menu-sidebar.active { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1500; }
        .overlay.active { display: block; }
        .menu-item { display: block; padding: 15px; color: white; text-decoration: none; border-radius: 8px; cursor: pointer; margin-bottom: 5px; }
        .menu-item:hover { background: #333; }
        .menu-item i { margin-right: 15px; width: 20px; text-align: center; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* LANDSCAPE FIX */
        @media (orientation: landscape) and (max-width: 900px) {
            nav { display: none; }
            .container { padding: 0; }
            #video-display { max-width: 100vw; margin: 0; }
            .player-wrapper { border-radius: 0; border: none; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="intro-loader">
        <div class="intro-logo">Nachyn<span>Tube</span></div>
        <div class="loader-container">
            <div class="loader-fill"></div>
        </div>
        <p style="color: #666; font-size: 13px; margin-top: 15px; letter-spacing: 1px;">MEMPERSIAPKAN AKSES PREMIUM...</p>
    </div>

    <div id="loader-bar"></div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav>
        <div class="logo" onclick="resetHome()">Nachyn<span>Tube</span></div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Cari apa saja...">
            <button onclick="searchVideo()"><i class="fas fa-search"></i></button>
        </div>
        <div class="nav-right">
            <button onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <div id="menu-sidebar">
        <h2 style="margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between;">
            Menu <i class="fas fa-times" onclick="toggleMenu()" style="cursor: pointer; font-size: 18px; color: #aaa;"></i>
        </h2>
        <div class="menu-item" onclick="resetHome()"><i class="fas fa-home"></i> Beranda</div>
        <div class="menu-item" onclick="searchByTag('Trending')"><i class="fas fa-bolt"></i> Trending</div>
        <div class="menu-item" onclick="searchByTag('Music')"><i class="fas fa-music"></i> Musik</div>
        <div class="menu-item" onclick="searchByTag('Gaming')"><i class="fas fa-gamepad"></i> Game</div>
        <div style="border-top: 1px solid #333; margin: 15px 0;"></div>
        <div class="menu-item" style="color: #ff0000;"><i class="fas fa-crown"></i> Nachyn Premium: Aktif</div>
    </div>

    <div class="container">
        <div id="video-display">
            <div class="player-wrapper" id="player"></div>
            <h2 id="playing-title" style="margin-top: 15px; font-size: 18px; font-weight: 500;"></h2>
            <p id="playing-channel" style="color: #aaa; font-size: 14px; margin-bottom: 10px;"></p>
        </div>
        <div class="results-grid" id="results"></div>
    </div>

    <script>
        // MASUKKAN API KEY GOOGLE CLOUD ANDA DI SINI
        const API_KEY = 'AIzaSyDcY-7czDHgxYjCe6wvjZhusV-4DSBXGkM'; 

        // LOGIKA LOADING 10 DETIK
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-loader');
                intro.style.opacity = '0';
                setTimeout(() => intro.style.visibility = 'hidden', 1000);
            }, 10000); // 10000ms = 10 Detik
        });

        function toggleMenu() {
            document.getElementById('menu-sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function resetHome() {
            document.getElementById('search-input').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('video-display').style.display = 'none';
            document.getElementById('player').innerHTML = '';
            if(document.getElementById('menu-sidebar').classList.contains('active')) toggleMenu();
        }

        async function searchByTag(tag) {
            document.getElementById('search-input').value = tag;
            toggleMenu();
            searchVideo();
        }

        function showLoading() { document.getElementById('loader-bar').style.width = '70%'; }
        function hideLoading() { 
            const lb = document.getElementById('loader-bar');
            lb.style.width = '100%'; 
            setTimeout(() => lb.style.width = '0%', 300); 
        }

        async function searchVideo() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            showLoading();

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`);
                const data = await response.json();
                
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <img src="${item.snippet.thumbnails.high.url}">
                        <div class="video-info">
                            <div class="avatar">${item.snippet.channelTitle.charAt(0)}</div>
                            <div class="text-info">
                                <h3>${item.snippet.title}</h3>
                                <p>${item.snippet.channelTitle}</p>
                            </div>
                        </div>`;
                    card.onclick = () => playVideo(item.id.videoId, item.snippet.title, item.snippet.channelTitle);
                    resultsDiv.appendChild(card);
                });
            } catch (e) { alert("Waduh, cek API Key lo!"); }
            hideLoading();
        }

        function playVideo(id, title, channel) {
            window.scrollTo({top: 0, behavior: 'smooth'});
            document.getElementById('video-display').style.display = 'block';
            document.getElementById('playing-title').innerText = title;
            document.getElementById('playing-channel').innerText = channel;
            
            // Player dengan integrasi API YouTube yang lebih stabil
            document.getElementById('player').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&showinfo=0&enablejsapi=1" 
                frameborder="0" allow="autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }

        document.getElementById('search-input').onkeypress = (e) => { if(e.key === 'Enter') searchVideo(); };
    </script>
</body>
</html>
