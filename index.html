<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NachynTube Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #000; color: #fff; }

        /* LOADING 10 DETIK */
        #intro {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .bar { width: 200px; height: 4px; background: #333; margin-top: 20px; border-radius: 5px; overflow: hidden; }
        .fill { width: 0%; height: 100%; background: red; animation: load 10s linear forwards; }
        @keyframes load { to { width: 100%; } }

        /* NAVBAR */
        nav { position: fixed; top: 0; width: 100%; height: 60px; background: #000; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #333; z-index: 1000; }
        .search-box { flex: 1; display: flex; margin: 0 10px; }
        input { flex: 1; padding: 8px; border-radius: 5px 0 0 5px; border: 1px solid #333; background: #111; color: #fff; outline: none; }
        button { padding: 8px 15px; background: #333; color: #fff; border: none; border-radius: 0 5px 5px 0; cursor: pointer; }

        /* CONTAINER */
        .container { padding: 70px 10px 20px; }
        
        /* PLAYER - GUE KASIH BORDER BIAR KELIATAN */
        #player-area { display: none; width: 100%; max-width: 800px; margin: 0 auto 20px; border: 2px solid #ff0000; border-radius: 10px; overflow: hidden; }
        .ratio { position: relative; padding-top: 56.25%; background: #111; }
        .ratio iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .card { cursor: pointer; background: #111; border-radius: 8px; overflow: hidden; }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .card p { padding: 8px; font-size: 12px; height: 45px; overflow: hidden; }
    </style>
</head>
<body>

    <div id="intro">
        <h1 style="color:red">Nachyn<span style="color:white">Tube</span></h1>
        <div class="bar"><div class="fill"></div></div>
        <p style="margin-top:10px; font-size:12px">BYPASSING YOUTUBE ADS...</p>
    </div>

    <nav>
        <b onclick="location.reload()">Nachyn<span style="color:red">Tube</span></b>
        <div class="search-box">
            <input type="text" id="in" placeholder="Cari Minecraft, Music, dll...">
            <button onclick="search()"><i class="fas fa-search"></i>Cari</button>
        </div>
    </nav>

    <div class="container">
        <div id="player-area">
            <div class="ratio" id="frame"></div>
            <h3 id="t" style="padding:10px; font-size:14px"></h3>
        </div>

        <div class="grid" id="out"></div>
    </div>

    <script>
        const KEY = 'AIzaSyDcY-7czDHgxYjCe6wvjZhusV-4DSBXGkM'; // <--- WAJIB ISI INI!!

        // Intro 10 Detik
        setTimeout(() => { document.getElementById('intro').style.display = 'none'; }, 10000);

        async function search() {
            const q = document.getElementById('in').value;
            if(!q) return;
            try {
                const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(q)}&type=video&key=${KEY}`);
                const d = await r.json();
                const grid = document.getElementById('out');
                grid.innerHTML = '';
                d.items.forEach(i => {
                    grid.innerHTML += `
                        <div class="card" onclick="play('${i.id.videoId}', '${i.snippet.title.replace(/'/g, "")}')">
                            <img src="${i.snippet.thumbnails.medium.url}">
                            <p>${i.snippet.title}</p>
                        </div>`;
                });
            } catch(e) { alert("API ERROR!"); }
        }

        function play(id, title) {
            // SCROLL KE ATAS SUPAYA PLAYER KELIATAN
            window.scrollTo({top: 0, behavior: 'smooth'});
            
            document.getElementById('player-area').style.display = 'block';
            document.getElementById('t').innerText = title;
            
            // JALUR KHUSUS ANTI BLOKIR (youtube-nocookie)
            document.getElementById('frame').innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&controls=1" 
                frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }

        document.getElementById('in').onkeypress = (e) => { if(e.key === 'Enter') search(); };
    </script>
</body>
</html>
