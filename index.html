<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachyn - Premium Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --tube-accent: #ff3b3b;
            --tube-glow: rgba(255,59,59,0.3);
            --music-accent: #1db954; 
            --music-glow: rgba(29,185,84,0.3);
            --text: #f0f0f0;
            --text-muted: rgba(255,255,255,0.5);
            --accent: #ff3b3b;
            --accent2: #ff8c42;
            --bg-color: #0d0d12;
        }
        body.music-mode {
            --accent: var(--music-accent);
            --accent2: #1ed760;
            --bg-color: #0a0a0a; 
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit',sans-serif; background:var(--bg-color); color:var(--text); overflow-x:hidden; min-height:100vh; transition: background 0.5s ease; }

        /* ── INTER-TAB TRANSITION LOADING ── */
        #tab-loader {
            position: fixed; inset: 0; background: rgba(8, 8, 16, 0.85); backdrop-filter: blur(12px);
            z-index: 99999; display: none; align-items: center; justify-content: center; opacity: 0;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── BACKGROUND ORBS ── */
        .bg-orbs { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
        .orb { position:absolute; border-radius:50%; filter:blur(100px); opacity:0.1; transition: background 0.8s ease; }
        .orb-1 { width:500px;height:500px; background:radial-gradient(circle,var(--accent),transparent); top:-150px;left:-100px; }
        .orb-2 { width:400px;height:400px; background:radial-gradient(circle,#7b2fff,transparent); top:40%;right:-120px; }

        /* ── NAVBAR ── */
        nav {
            position:sticky; top:0; z-index:200; display:flex; justify-content:space-between; align-items:center;
            padding:0 24px; height:64px; background:rgba(15,15,20,0.8); backdrop-filter:blur(24px);
            border-bottom:1px solid var(--glass-border);
        }
        .logo { font-size:22px; font-weight:800; display:flex; align-items:center; gap:6px; cursor: pointer; }
        .logo-badge {
            padding:2px 8px; border-radius:6px; color:white; font-size: 13px;
            background:linear-gradient(135deg,var(--accent),var(--accent2)); transition:background 0.5s ease;
        }
        .nav-tabs { display:flex; gap:6px; }
        .nav-tab {
            display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:20px; cursor:pointer;
            font-size:14px; font-weight:600; color:var(--text-muted); transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-tab.active { color:#fff; background:rgba(255,255,255,0.08); }
        body.music-mode .nav-tab.music-tab.active { background: var(--music-accent); color: black; }

        .search-container { display:flex; width:30%; min-width: 260px; }
        .search-container input {
            flex:1; padding:10px 16px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:white; 
            font-family:'Outfit',sans-serif; font-size:14px; border-radius:20px 0 0 20px; outline:none;
        }
        .search-container button {
            padding:10px 20px; background:var(--accent); border:none; color:white; font-family:'Outfit',sans-serif;
            font-weight:600; border-radius:0 20px 20px 0; cursor:pointer; transition:all 0.3s;
        }

        /* ── GRID SYSTEM ── */
        .page { display:none; }
        .page.active { display:block; }
        .container { padding:24px; max-width: 1300px; margin: 0 auto; }

        /* ── LAYOUT TUBE ALA YOUTUBE ASLI ── */
        .tube-main-layout { display: grid; grid-template-columns: 1fr; gap: 24px; width: 100%; margin-bottom: 30px; }
        #video-display { display: none; width: 100%; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        /* Floating Video Pojok Kanan Bawah saat Scroll */
        #video-display.floating {
            position: fixed; bottom: 90px; right: 24px; width: 320px; z-index: 1000; margin: 0;
            box-shadow: 0 16px 40px rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden;
        }
        #video-display.floating .tube-details,
        #video-display.floating .related-section { display: none !important; }
        #video-display.floating .player-wrapper { border-radius: 10px; }

        .player-wrapper { position:relative; padding-top:56.25%; border-radius:16px; overflow:hidden; background:#000; }
        .player-wrapper iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
        
        .tube-details { margin-top: 16px; border-bottom: 1px solid var(--glass-border); padding-bottom: 16px; }
        .tube-details h2 { font-size: 20px; font-weight: 700; line-height: 1.4; color: #fff; }
        .tube-metadata { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; flex-wrap: wrap; gap: 12px; }
        .channel-info { display: flex; align-items: center; gap: 10px; }
        .channel-info .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2a2a35; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
        .channel-text h4 { font-size: 15px; font-weight: 600; }
        .channel-text p { font-size: 12px; color: var(--text-muted); }
        
        .tube-desc-box { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 14px; margin-top: 14px; font-size: 13.5px; line-height: 1.5; color: #e0e0e0; }
        
        /* ── SECTION TERKAIT / REKOMENDASI ── */
        .related-section { margin-top: 24px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .results-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; width: 100%; }

        /* CARD */
        .video-card {
            cursor:pointer; background:rgba(255,255,255,0.02); border-radius:14px; overflow:hidden;
            transition:all 0.3s ease; padding: 10px; border: 1px solid transparent;
        }
        .video-card:hover { transform:translateY(-4px); background:rgba(255,255,255,0.06); border-color: var(--glass-border); }
        .thumb-wrap { position:relative; overflow:hidden; border-radius: 10px; }
        .thumb-wrap img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; transition: transform 0.4s; }
        body.music-mode .thumb-wrap img { aspect-ratio: 1/1; }
        
        .play-btn {
            position: absolute; bottom: 10px; right: 10px; width:36px; height:36px; border-radius:50%;
            background:var(--accent); display:flex; align-items:center; justify-content:center; color: white; font-size:14px;
            opacity:0; transform:translateY(5px); transition:all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        body.music-mode .play-btn { color: black; background: var(--music-accent); }
        .video-card:hover .play-btn { opacity:1; transform:translateY(0); }
        .card-body { padding: 10px 4px 4px; }
        .card-body h3 { font-size:13.5px; font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color: #f0f0f0; }
        .card-body .channel { font-size:12px; color:var(--text-muted); margin-top:4px; }

        /* ── RAMPING MINI PLAYER (DEFAULT BAWAH) ── */
        #spotify-player {
            position:fixed; bottom:0; left:0; right:0; z-index:300;
            background:#121212; border-top:1px solid #282828;
            padding:12px 24px; display:none; justify-content: space-between; align-items:center;
            transition: all 0.5s cubic-bezier(0.2, 1, 0.2, 1); height: 76px;
        }
        
        .sp-left { display: flex; align-items: center; gap: 12px; width: 30%; min-width: 180px; }
        .sp-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; transition: transform 0.5s ease; }
        .sp-info { overflow: hidden; }
        .sp-title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .sp-channel { font-size: 12px; color: #b3b3b3; margin-top: 2px; }

        .sp-center { display: flex; flex-direction: column; align-items: center; width: 40%; max-width: 500px; }
        .sp-controls { display: flex; align-items: center; gap: 20px; margin-bottom: 6px; }
        .sp-btn { background: none; border: none; color: #bababa; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .sp-btn:hover { color: #fff; }
        .sp-play { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 13px; border:none; cursor:pointer; }
        .sp-play:hover { transform: scale(1.06); }

        .sp-progress-container { display: flex; align-items: center; gap: 8px; width: 100%; }
        .sp-time { font-size: 11px; color: #a7a7a7; min-width: 32px; }
        .sp-bar-bg { flex: 1; height: 4px; background: #404040; border-radius: 2px; cursor: pointer; position: relative; }
        .sp-bar-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; }
        .sp-bar-bg:hover .sp-bar-fill { background: var(--music-accent); }

        .sp-right { display: flex; align-items: center; justify-content: flex-end; gap: 16px; width: 30%; }

        /* ── EXTREME SPOTIFY FULL SCREEN MODE ── */
        #spotify-player.expanded {
            height: 100vh; top: 0; bottom: 0; background: linear-gradient(to bottom, #14281e, #0a0f0d, #050505);
            flex-direction: column; justify-content: flex-start; align-items: center; padding: 60px 24px 40px; gap: 0;
            overflow-y: auto;
        }
        
        #spotify-player.expanded .btn-minimize { display: block; }
        #spotify-player.expanded .sp-left {
            flex-direction: column; width: 100%; max-width: 380px; text-align: center; align-items: center; gap: 16px;
            margin-top: 40px; margin-bottom: 24px;
        }
        #spotify-player.expanded .sp-thumb {
            width: 85%; aspect-ratio: 1/1; height: auto; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        #spotify-player.expanded .sp-info { text-align: left; width: 85%; }
        #spotify-player.expanded .sp-title { font-size: 20px; font-weight: 700; white-space: normal; }
        #spotify-player.expanded .sp-channel { font-size: 15px; color: rgba(255,255,255,0.6); }
        
        #spotify-player.expanded .sp-center { width: 85%; max-width: 380px; margin-bottom: 40px; }
        #spotify-player.expanded .sp-controls { gap: 36px; margin-bottom: 16px; }
        #spotify-player.expanded .sp-btn { font-size: 24px; }
        #spotify-player.expanded .sp-play { width: 56px; height: 56px; font-size: 20px; }
        #spotify-player.expanded .sp-bar-bg { height: 5px; }

        #spotify-player.expanded .sp-right { display: none; } /* Sembunyikan sisi kanan mini player */
        
        /* Container Rekomendasi Musik saat Full Screen */
        .spotify-related-container { display: none; width: 100%; max-width: 420px; margin-top: 20px; padding: 0 20px 40px; }
        #spotify-player.expanded .spotify-related-container { display: block; }

        .btn-minimize { display: none; position: absolute; top: 20px; left: 24px; background: none; border: none; color: white; font-size: 28px; cursor: pointer; }

        @media(max-width:768px) {
            nav { flex-direction: column; height: auto; padding: 12px; gap: 10px; }
            .search-container { width: 100%; }
            #spotify-player:not(.expanded) .sp-center { display: none; }
            #spotify-player:not(.expanded) .sp-left { width: 70%; }
            #spotify-player:not(.expanded) .sp-right { width: 25%; }
        }
    </style>
</head>
<body>

<div id="tab-loader"><div class="spinner"></div></div>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<nav>
    <div class="logo" onclick="window.location.reload()">
        <span>Nachyn</span><span class="logo-badge" id="logo-badge">Tube</span>
    </div>
    <div class="nav-tabs">
        <div class="nav-tab active" id="tab-tube" onclick="switchPageWithLoading('tube')">▶ NachynTube</div>
        <div class="nav-tab music-tab" id="tab-music" onclick="switchPageWithLoading('music')">♪ NachynMusic</div>
    </div>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Cari video favoritmu...">
        <button id="search-btn" onclick="doSearch()">Cari</button>
    </div>
</nav>

<div class="page active" id="page-tube">
    <div class="container">
        <div class="tube-main-layout">
            <div id="video-display">
                <div class="player-wrapper" id="player"></div>
                <div class="tube-details">
                    <h2 id="playing-title">—</h2>
                    <div class="tube-metadata">
                        <div class="channel-info">
                            <div class="avatar" id="video-avatar">N</div>
                            <div class="channel-text">
                                <h4 id="video-channel">—</h4>
                                <p>1.2M Subscriber</p>
                            </div>
                        </div>
                    </div>
                    <div class="tube-desc-box">
                        <strong>Deskripsi Video:</strong>
                        <p id="video-desc">Selamat datang di layanan premium NachynTube. Tontonan lancar tanpa iklan pembatas berkualitas tinggi.</p>
                    </div>
                </div>
            </div>

            <div class="related-section">
                <div class="section-title" id="tube-label">🔥 Video Populer Rekomendasi</div>
                <div class="results-grid" id="tube-results"></div>
            </div>
        </div>
    </div>
</div>

<div class="page" id="page-music">
    <div class="container">
        <div class="section-title" id="music-label">🎧 Lagu Populer Spotify Hits</div>
        <div class="results-grid" id="music-results"></div>
    </div>
</div>

<div id="spotify-player">
    <button class="btn-minimize" onclick="minimizeSpotifyPlayer()"></button>
    
    <div class="sp-left">
        <img class="sp-thumb" id="sp-thumb" src="" alt="Cover">
        <div class="sp-info">
            <div class="sp-title" id="sp-title">—</div>
            <div class="sp-channel" id="sp-channel">—</div>
        </div>
    </div>
    
    <div class="sp-center">
        <div class="sp-controls">
            <button class="sp-btn" onclick="prevTrack()">⏮</button>
            <button class="sp-play" id="sp-play-btn" onclick="togglePlay()">▶</button>
            <button class="sp-btn" onclick="nextTrack()">⏭</button>
        </div>
        <div class="sp-progress-container">
            <span class="sp-time" id="sp-time-cur">0:00</span>
            <div class="sp-bar-bg" id="sp-prog-bar" onclick="seekTrack(event)">
                <div class="sp-bar-fill" id="sp-prog-fill"></div>
            </div>
            <span class="sp-time" id="sp-time-dur">0:00</span>
        </div>
    </div>

    <div class="sp-right">
        <button class="sp-btn-extra" onclick="maximizeSpotifyPlayer()" title="Full Screen">⛶</button>
        <button class="sp-btn-extra" onclick="closePlayer()">✕</button>
    </div>
    
    <div class="spotify-related-container">
        <div class="section-title" style="margin-bottom: 12px; font-size: 14px; color: #1db954;">✨ Musik Terkait Untukmu</div>
        <div id="spotify-mini-queue" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<div id="yt-player-dummy" style="position:fixed; left:-9999px; top:-9999px; width:1px; height:1px;"></div>

<script>
const API_KEY = 'AIzaSyDcY-7czDHgxYjCe6wvjZhusV-4DSBXGkM'; 

let currentPage = 'tube';
let ytPlayer = null; 
let musicQueue = [];
let currentTrackIdx = 0;
let isPlaying = false;
let progressInterval = null;
let isVideoPlaying = false;

window.onload = () => {
    loadBerandaDefault();
    window.addEventListener('scroll', handleVideoScroll);
};

function loadBerandaDefault() {
    fetchYoutubeAPI('Trending Indonesia', 'tube', 12);
    fetchYoutubeAPI('Lagu Pop Hits Indonesia', 'music', 12);
}

function switchPageWithLoading(page) {
    if (page === currentPage) return;
    const tabLoader = document.getElementById('tab-loader');
    tabLoader.style.display = 'flex'; tabLoader.style.opacity = '1';
    
    if (page === 'music') {
        document.getElementById('player').innerHTML = '';
        document.getElementById('video-display').style.display = 'none';
        isVideoPlaying = false;
    } else {
        if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
        clearInterval(progressInterval); isPlaying = false; updatePlayBtnUI();
        document.getElementById('spotify-player').style.display = 'none';
        minimizeSpotifyPlayer();
    }

    setTimeout(() => {
        switchPage(page);
        tabLoader.style.opacity = '0';
        setTimeout(() => tabLoader.style.display = 'none', 300);
    }, 500);
}

function switchPage(page) {
    currentPage = page;
    document.getElementById('page-tube').classList.toggle('active', page === 'tube');
    document.getElementById('page-music').classList.toggle('active', page === 'music');
    document.getElementById('tab-tube').classList.toggle('active', page === 'tube');
    document.getElementById('tab-music').classList.toggle('active', page === 'music');
    document.body.classList.toggle('music-mode', page === 'music');
    document.getElementById('logo-badge').textContent = page === 'tube' ? 'Tube' : 'Music';
}

function handleVideoScroll() {
    if (currentPage !== 'tube' || !isVideoPlaying) return;
    const videoDisplay = document.getElementById('video-display');
    if (window.scrollY > 400) {
        videoDisplay.classList.add('floating');
    } else {
        videoDisplay.classList.remove('floating');
    }
}

function doSearch() {
    const queryStr = document.getElementById('search-input').value.trim();
    if (!queryStr) return;
    if (currentPage === 'tube') {
        document.getElementById('tube-label').innerText = `Hasil Pencarian: "${queryStr}"`;
        fetchYoutubeAPI(queryStr, 'tube', 12);
    } else {
        document.getElementById('music-label').innerText = `Hasil Pencarian Musik: "${queryStr}"`;
        fetchYoutubeAPI(queryStr + ' official audio', 'music', 12);
    }
}

async function fetchYoutubeAPI(query, type, maxResults) {
    try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=${maxResults}&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        const grid = document.getElementById(`${type}-results`);
        grid.innerHTML = '';

        if (!data.items || data.items.length === 0) return;
        if(type === 'music') musicQueue = [];

        data.items.forEach((item, index) => {
            const cleanTitle = item.snippet.title.replace(/&quot;/g, '"').replace(/&#39;/g, "'");
            const channel = item.snippet.channelTitle;
            const thumbUrl = item.snippet.thumbnails.high.url;
            const vidId = item.id.videoId;
            const desc = item.snippet.description || "Tonton streaming video berkualitas di platform premium NachynTube.";

            if(type === 'music') musicQueue.push({ id: vidId, title: cleanTitle, channel: channel, thumb: thumbUrl });

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumb-wrap">
                    <img src="${thumbUrl}" loading="lazy">
                    <div class="play-btn">${type === 'tube' ? '▶' : '♪'}</div>
                </div>
                <div class="card-body">
                    <h3>${cleanTitle}</h3>
                    <div class="channel">${channel}</div>
                </div>`;
            
            card.onclick = () => type === 'tube' ? playTubeVideo(vidId, cleanTitle, channel, desc) : playMusicTrack(index);
            grid.appendChild(card);
        });

        if (type === 'music') buildSpotifyQueueUI();
    } catch(err) { console.error(err); }
}

function playTubeVideo(id, title, channel, desc) {
    isVideoPlaying = true;
    const display = document.getElementById('video-display');
    display.classList.remove('floating');
    display.style.display = 'block';
    
    document.getElementById('playing-title').innerText = title;
    document.getElementById('video-channel').innerText = channel;
    document.getElementById('video-avatar').innerText = channel.charAt(0);
    document.getElementById('video-desc').innerText = desc ? desc : "Tidak ada deskripsi tambahan.";
    
    document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player-dummy', {
        height: '0', width: '0', videoId: '',
        events: { 'onStateChange': onPlayerStateChange }
    });
}

function onPlayerStateChange(event) {
    if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true; updatePlayBtnUI(); startProgressBarTracker();
    } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
        isPlaying = false; updatePlayBtnUI(); clearInterval(progressInterval);
        if (event.data == YT.PlayerState.ENDED) nextTrack();
    }
}

function playMusicTrack(idx) {
    if(!ytPlayer || !ytPlayer.loadVideoById) return;
    currentTrackIdx = idx;
    const track = musicQueue[idx];
    if (!track) return;

    document.getElementById('spotify-player').style.display = 'flex';
    document.getElementById('sp-thumb').src = track.thumb;
    document.getElementById('sp-title').textContent = track.title;
    document.getElementById('sp-channel').textContent = track.channel;

    ytPlayer.loadVideoById(track.id);
    isPlaying = true;
    updatePlayBtnUI();
    buildSpotifyQueueUI();
}

function buildSpotifyQueueUI() {
    const queueList = document.getElementById('spotify-mini-queue');
    queueList.innerHTML = '';
    let count = 0;
    
    musicQueue.forEach((track, index) => {
        if(index === currentTrackIdx || count >= 4) return;
        count++;
        const item = document.createElement('div');
        item.style.cssText = "display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.04); padding:8px; border-radius:8px; cursor:pointer;";
        item.innerHTML = `
            <img src="${track.thumb}" style="width:40px; height:40px; border-radius:4px; object-fit:cover;">
            <div style="overflow:hidden; flex:1;">
                <h5 style="font-size:12px; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; color:#fff;">${track.title}</h5>
                <p style="font-size:10px; color:#b3b3b3;">${track.channel}</p>
            </div>
            <span style="color:#1db954; font-size:12px;">♪</span>
        `;
        item.onclick = (e) => {
            e.stopPropagation();
            playMusicTrack(index);
        };
        queueList.appendChild(item);
    });
}

function togglePlay() {
    if (!ytPlayer || !ytPlayer.getPlayerState) return;
    if (ytPlayer.getPlayerState() == YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
}

function updatePlayBtnUI() {
    document.getElementById('sp-play-btn').innerHTML = isPlaying ? '⏸' : '▶';
}

function nextTrack() { if (musicQueue.length > 0) playMusicTrack((currentTrackIdx + 1) % musicQueue.length); }
function prevTrack() { if (musicQueue.length > 0) playMusicTrack((currentTrackIdx - 1 + musicQueue.length) % musicQueue.length); }

function startProgressBarTracker() {
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        if (!ytPlayer || !isPlaying) return;
        const currentSec = ytPlayer.getCurrentTime() || 0;
        const totalDuration = ytPlayer.getDuration() || 0;
        if (totalDuration > 0) {
            const percent = (currentSec / totalDuration) * 100;
            document.getElementById('sp-prog-fill').style.width = percent + '%';
            document.getElementById('sp-time-cur').textContent = fmtTime(currentSec);
            document.getElementById('sp-time-dur').textContent = fmtTime(totalDuration);
        }
    }, 400);
}

function seekTrack(e) {
    if (!ytPlayer || !ytPlayer.getDuration) return;
    const bar = document.getElementById('sp-prog-bar');
    const ratio = e.offsetX / bar.offsetWidth;
    ytPlayer.seekTo(ytPlayer.getDuration() * ratio, true);
}

function closePlayer() {
    if(ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
    clearInterval(progressInterval);
    document.getElementById('spotify-player').style.display = 'none';
    minimizeSpotifyPlayer();
}

function fmtTime(seconds) {
    const s = Math.floor(seconds || 0);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2,'0')}`;
}

function maximizeSpotifyPlayer() {
    document.getElementById('spotify-player').classList.add('expanded');
}

function minimizeSpotifyPlayer() {
    document.getElementById('spotify-player').classList.remove('expanded');
}
</script>
</body>
</html>
